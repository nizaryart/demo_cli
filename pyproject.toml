[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo_cli"
dynamic = ["version"]
description = "A pre-execution safety layer for AI coding agents: preview, snapshot, undo, and a hash-chained receipt of every decision."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WePwn" }]
keywords = ["ai-agents", "safety", "guardrails", "claude-code", "recovery", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

# The filesystem guard (Windows). `fsmount.py` genuinely imports winfspy, so
# this is a real dependency - but an OPTIONAL one, on purpose:
#
#   winfspy is a binding, not the driver. It is useless without WinFsp itself
#   (an MSI from winfsp.dev, installed with the Developer feature), and on a
#   machine without it the install can fail outright. As a hard dependency
#   that failure would take the STRING layer down with it - a user who only
#   wanted the classifier would end up with no demo_cli at all.
#
#   So the installer checks for the driver first, installs it if missing, and
#   only then asks for this extra. Order matters; see install.ps1.
windows = ["winfspy>=0.8.4; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/nizaryart/DEMO_LOADING"
Issues = "https://github.com/nizaryart/DEMO_LOADING/issues"

[project.scripts]
demo_cli = "demo_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "demo_cli.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
